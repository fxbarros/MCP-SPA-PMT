[project]
name = "spa-mcp"
version = "0.1.0"
description = "MCP server for SPA-PMT (Sistema de Processos Automatizados - Prefeitura de Teresina)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "keyring>=25.7.0",
    "fastmcp>=2.14.0",
    "pydantic>=2.13.3",
    "scrapling[fetchers]>=0.4.9",
    "pymupdf>=1.28.0",
]

[project.scripts]
spa-mcp = "spa_mcp.server:main"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"
